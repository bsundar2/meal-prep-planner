databases:
  - name: meal-prep-planner-db
    plan: free
    databaseName: meal_prep_planner
    user: meal_prep_planner

services:
  - type: web
    name: meal-prep-planner
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npx prisma db seed && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meal-prep-planner-db
          property: connectionString
      - key: NODE_ENV
        value: production
